<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discussion Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* dcore page. Claude fills only the JSON in <script id="deliberation"> near the end; the rest stays as is. */
:root {
  --bg: #f4f4f1; --paper: #fdfdfb; --ink: #1f2328; --soft: #6a7078; --line: #e1e2dd; --wash: #efefea;
  --holds: #22745a; --holds-wash: #e1f0e9; --challenged: #a8670f; --challenged-wash: #f8ecd9;
  --fails: #a4423a; --fails-wash: #f6e4e1; --open: #6f7680; --open-wash: #eceef0;
  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --paper: #1a1d21; --ink: #e8e9e6; --soft: #9aa0a8; --line: #2e3238; --wash: #23272c;
  --holds: #6cc4a3; --holds-wash: #1b3229; --challenged: #e3a64e; --challenged-wash: #3a2c17;
  --fails: #e48a80; --fails-wash: #3b2321; --open: #a3a9b1; --open-wash: #262a30; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121417; --paper: #1a1d21; --ink: #e8e9e6; --soft: #9aa0a8; --line: #2e3238; --wash: #23272c;
  --holds: #6cc4a3; --holds-wash: #1b3229; --challenged: #e3a64e; --challenged-wash: #3a2c17;
  --fails: #e48a80; --fails-wash: #3b2321; --open: #a3a9b1; --open-wash: #262a30; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header h1 { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 2px 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--soft); max-width: 64ch; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
section { display: grid; gap: 10px; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px clamp(14px, 3vw, 24px); min-width: 0; }
.tc { font: 400 11px var(--mono); color: var(--soft); white-space: nowrap; }
a.tc { text-decoration: none; } a.tc:hover { color: var(--ink); text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.toggle { display: inline-flex; background: var(--wash); border-radius: 999px; padding: 2px; }
.toggle button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--soft); }
.toggle button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--soft); margin-bottom: 14px; }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }

/* One rope per option: what argued for it on the left, against it on the right (stacked on phones). */
.rope + .rope { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.rope-title { font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 8px; }
.sides { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 680px) { .sides { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
  .side.for { border-right: 1px solid var(--soft); padding-right: 16px; } .side.against { padding-left: 16px; }
  .side.for h3 { text-align: right; } }
.side h3 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 500; }
.none { margin: 0; font-size: 12.5px; color: var(--soft); font-style: italic; }
.pts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pt { border-radius: 6px; padding: 7px 10px; border: 1px solid transparent; }
.pt.holds { background: var(--holds-wash); } .pt.challenged { background: var(--challenged-wash); }
.pt.open { background: var(--open-wash); }
.pt.fails { border: 1px dashed var(--line); }
.pt .say { display: block; font-weight: 500; line-height: 1.4; }
.pt.fails .say { text-decoration: line-through; color: var(--soft); font-weight: 400; }
.trail { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; line-height: 1.4; color: var(--soft); display: grid; gap: 1px; }
.trail li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 6px; }
.trail .end { color: var(--ink); font-weight: 500; }
.lean { text-align: center; font-size: 12.5px; color: var(--soft); margin: 8px 0 0; }

/* Timeline view */
.story { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--line); display: grid; gap: 16px; }
.story li { position: relative; }
.story li::before { content: ""; position: absolute; left: -23px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--soft); }
.story li.turn::before { background: var(--fails); border-color: var(--fails); }
.story li.common::before { background: var(--holds); border-color: var(--holds); }
.story b { font-weight: 600; } .story b .tc { margin-left: 4px; }
.story p { margin: 2px 0 0; max-width: 66ch; }
.story .shift { display: block; margin-top: 2px; font-size: 12px; color: var(--soft); }

.qs { margin: 0; padding: 0; list-style: none; }
.qs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.qs li:first-child { border-top: 0; padding-top: 0; }
.q { font-weight: 600; }
.a { grid-column: 1; max-width: 66ch; }
.tag { font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; grid-row: 1; grid-column: 2; }
.tag.holds { background: var(--holds-wash); color: var(--holds); }
.tag.challenged { background: var(--challenged-wash); color: var(--challenged); }
.tag.open { background: var(--open-wash); color: var(--open); }
.tag.fails { background: var(--fails-wash); color: var(--fails); }
footer { font-size: 12px; color: var(--soft); max-width: 64ch; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">What happened in this discussion</span>
    <h1 id="topic"></h1>
    <p id="about"></p>
  </header>

  <section aria-labelledby="h-main">
    <div class="bar">
      <h2 id="h-main">How each point fared</h2>
      <div class="toggle" role="group" aria-label="View">
        <button type="button" data-view="points" aria-pressed="true">Points</button>
        <button type="button" data-view="timeline" aria-pressed="false">Timeline</button>
      </div>
    </div>
    <div class="sheet" id="points-view"><div class="key" id="key"></div><div id="ropes"></div></div>
    <div class="sheet" id="timeline-view" hidden><ol class="story" id="story"></ol></div>
  </section>

  <section aria-labelledby="h-qs">
    <h2 id="h-qs">Your questions, answered</h2>
    <div class="sheet"><ul class="qs" id="qs"></ul></div>
  </section>

  <footer><span id="source"></span> Voices are anonymous. Nothing here is fact-checked: "stands" means no one in the discussion knocked it down, not that it's true.</footer>
</div>

<script>
(() => {
  const D = JSON.parse(document.getElementById('deliberation').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const secs = t => t.split(':').map(Number).reduce((a, n) => a * 60 + n, 0);
  // With a video link, each timestamp opens the video at that moment.
  const tc = t => {
    if (!t) return '<span class="tc"></span>';
    if (!D.video) return `<span class="tc">${esc(t)}</span>`;
    const u = new URL(D.video); u.searchParams.set('t', secs(t) + 's');
    return `<a class="tc" href="${esc(u.href)}" target="_blank" rel="noopener">${esc(t)}</a>`;
  };
  const TAG = { 'settled': 'holds', 'leans yes': 'challenged', 'leans no': 'fails', 'disputed': 'challenged', 'open': 'open' };

  document.title = D.topic;
  document.getElementById('topic').textContent = D.topic;
  document.getElementById('about').textContent = D.about;
  document.getElementById('source').textContent = D.source || '';

  document.getElementById('key').innerHTML = [['holds-wash', 'stands'], ['challenged-wash', 'disputed'], ['open-wash', 'never taken up'], [null, 'fell away']]
    .map(([c, l]) => `<span><i style="${c ? `background:var(--${c})` : 'border-style:dashed;border-color:var(--soft)'}"></i>${l}</span>`).join('');

  const point = p => `<li class="pt ${esc(p.end)}"><span class="say">${esc(p.say)}</span><ul class="trail">${
    p.steps.map(s => `<li>${tc(s.t)}<span>${esc(s.did)}</span></li>`).join('')
  }<li>${tc('')}<span class="end">${esc(p.outcome)}</span></li></ul></li>`;
  const side = (o, k, h) => `<div class="side ${k}"><h3>${h}</h3>${
    (o[k] || []).length ? `<ul class="pts">${o[k].map(point).join('')}</ul>` : '<p class="none">Nothing was raised.</p>'}</div>`;
  document.getElementById('ropes').innerHTML = D.options.map(o =>
    `<div class="rope"><div class="rope-title">${esc(o.title)}</div><div class="sides">${side(o, 'for', 'For')}${side(o, 'against', 'Against')}</div>${
      o.lean ? `<p class="lean">${esc(o.lean)}</p>` : ''}</div>`).join('');

  document.getElementById('story').innerHTML = D.moments.map(m =>
    `<li class="${esc(m.kind || '')}"><b>${esc(m.title)} ${tc(m.t)}</b><p>${esc(m.text)}</p>${m.shift ? `<span class="shift">${esc(m.shift)}</span>` : ''}</li>`).join('');

  document.getElementById('qs').innerHTML = D.questions.map(q =>
    `<li><span class="q">${esc(q.q)}</span><span class="tag ${TAG[q.answer] || 'open'}">${esc(q.answer)}</span><span class="a">${esc(q.a)}</span></li>`).join('');

  document.querySelector('.toggle').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('points-view').hidden = b.dataset.view !== 'points';
    document.getElementById('timeline-view').hidden = b.dataset.view !== 'timeline';
  });
})();
</script>
